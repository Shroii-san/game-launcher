name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What's Changed

  $CHANGES

  ## Notes
  - This release was generated automatically.
  - See the full history for details.

exclude-labels:
  - ignore-for-release
exclude-contributors:
  - github-actions[bot]

categories:
  - title: "🚀 Features"
    labels:
      - feature
      - enhancement

  - title: "🐛 Bug Fixes"
    labels:
      - bug
      - fix

  - title: "🛠️ Maintenance"
    labels:
      - maintenance
      - chore

  - title: "📦 Other Changes"
    labels:
      - "*"
